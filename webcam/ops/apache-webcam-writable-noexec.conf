# Apache muss Bilder, Cache- und Statusdateien erzeugen können. Aus diesen
# beschreibbaren Verzeichnissen darf er jedoch niemals serverseitigen Code
# ausführen: Andernfalls könnte eine Schwachstelle einen dauerhaften Webshell
# im ansonsten schreibgeschützten Projekt hinterlassen.
<DirectoryMatch "^/var/www/html/webcam/(?:var|cache|storage|[a-z0-9-]+/current)(?:/|$)">
    # Eine dort eingeschleuste .htaccess darf die Schutzregeln nicht ändern.
    AllowOverride None
    Options -ExecCGI

    # Handler entfernen und direkten HTTP-Zugriff auf ausführbare Dateitypen
    # sperren. Normale Bild-/Videoformate (einschließlich SVG-Overlays) bleiben
    # weiterhin auslieferbar.
    RemoveHandler .php .php3 .php4 .php5 .php7 .php8 .phtml .phar .cgi .pl .py .sh
    <FilesMatch "(?i)\.(?:php[0-9]?|phtml|phar|cgi|pl|py|sh)$">
        Require all denied
    </FilesMatch>
</DirectoryMatch>
