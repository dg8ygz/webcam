# Gemeinsame Quelle fuer Fotos UND Livestream. Genau eine source-Zeile aktiv.
# Nach Aenderung: sudo camera-rpi-source --check && sudo camera-rpi-source --apply
source=rtsp
# source=v4l2
# source=gphoto2

# IP-Kamera: RTSP ueber TCP, direkt vom Pi erreichbar.
rtsp_url=rtsp://192.0.2.110:554/11

# USB-Alternative: bleibt auch bei aktiver RTSP-Quelle vollstaendig erhalten.
video_device=/dev/v4l/by-id/usb-GENERAL_GENERAL_WEBCAM_JH0319_20210727_v017-video-index0
video_width=1920
video_height=1080
video_warmup_frames=15
video_input_fps=30

# Fotokamera: eos-legacy = Standard (bewaehrte EOS-Sequenz).
# standard = ausdrueckliche Alternative (direktes Capture & Download).
gphoto_capture_mode=eos-legacy
