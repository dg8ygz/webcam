# Lokale Sensoren und Geraetezustaende des Kamera-Pi.
#
# Diese Datei wird bei der ersten Installation nach
# /etc/camera-rpi/device.conf kopiert. Sie startet absichtlich deaktiviert,
# weil vor dem ersten echten Messversuch GPIO-Pin und Verdrahtung geprueft
# werden muessen.

enabled=false
sample_seconds=30
history_hours=24

# DHT22 ueber den Linux-IIO-Treiber. "auto" sucht ein IIO-Geraet mit dem
# Treibernamen dht11 (dieser Treiber bedient auch DHT22-Sensoren).
dht_iio_device=auto

# Alternativ koennen beide Dateien explizit angegeben werden. Das ist auch
# fuer andere Sensortreiber nutzbar. Die Werte werden in Tausendsteln erwartet:
# 23400 = 23,4 Grad Celsius; 56100 = 56,1 Prozent Luftfeuchte.
temperature_file=
humidity_file=
temperature_scale=1000
humidity_scale=1000

# Optionaler Rueckmeldekontakt der Heizung. Die Datei muss 0 oder 1 enthalten.
# heater_active_value legt fest, welcher Wert "Heizung an" bedeutet.
heater_state_file=
heater_active_value=1

# Optionaler PWM-/Leistungswert des Luefters. Beispiel: Eine Datei mit 128 und
# fan_percent_max=255 wird als etwa 50 Prozent angezeigt.
fan_percent_file=
fan_percent_max=255

# Fuer die ehrliche Aussage "Luefter dreht" ist eine Rueckmeldung noetig:
# entweder eine Drehzahl in U/min oder ein digitaler Laufkontakt.
fan_rpm_file=
fan_running_file=
fan_running_active_value=1
