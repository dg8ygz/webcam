# Ein Zielserver = eine Datei. Die Werte links vom Gleichheitszeichen duerfen
# nicht umbenannt werden. Leerzeichen um das Gleichheitszeichen sind erlaubt.

# Kurzer interner Name. Er bestimmt auch den systemd-Instanznamen.
server_id=beispiel-prod

# Basisadresse der Webcam-Anwendung, ohne include/command.php.
server_base_url=https://webcam.example/webcam

# Kennung der Kamera auf genau diesem Zielserver.
camera_slug=bielefeld

# Der Key steht absichtlich NICHT in dieser Datei.
key_file=/etc/camera-rpi/keys/beispiel-prod.key

# false stoppt nur diesen Zielserver; die anderen laufen weiter.
enabled=true

# Die folgenden Werte sind sichere Standardwerte. Meist muessen sie nicht
# geaendert werden.
poll_seconds=5
error_backoff_seconds=20
connect_timeout_seconds=10
# 2..900 Sekunden. Fuer Legacy-Long-Polling im 10-Minuten-Takt: 700.
# Reverse Proxy/Backend muessen entsprechend lange warten koennen.
# Lokale manuelle Auftraege werden erst nach Ende des laufenden Polls gelesen.
command_timeout_seconds=30
upload_timeout_seconds=90

# legacy sendet ein JPEG wie bisher in einem Request. chunked fragt zuerst die
# Gegenstelle nach camera-rpi-chunk-v1 und sendet dann kleine Teile. Kennt der
# Server das Protokoll nicht, faellt der Worker automatisch auf legacy zurueck.
upload_mode=legacy
upload_chunk_bytes=262144

gphoto_timeout_seconds=120

# gphoto2 bleibt Standard. v4l2 ist fuer USB-Webcams mit nativem MJPEG.
# Ein Quellwechsel ist auch ueber die Admin-Seite moeglich.
capture_backend=gphoto2
# Standard: bewaehrte EOS-Sequenz (Release Half / 5s / Immediate / Tethered /
# Release Half), nur JPEG. Alternative: standard = direktes Capture & Download.
# Die internen Werte bleiben zur Kompatibilitaet mit bestehenden Dateien gleich.
gphoto_capture_mode=eos-legacy
video_device=/dev/video0
video_width=1920
video_height=1080
video_warmup_frames=15
# Fuer V4L2 bevorzugt /dev/v4l/by-id/usb-...-video-index0 benutzen.
# V4L2: 5 s Formatpruefung + 30 s Capture, jeweils max. 2 s Kill-Nachlauf.
# gphoto_timeout_seconds gilt weiterhin nur fuer gphoto2.

operation_lock_timeout_seconds=900
max_command_age_seconds=900
max_command_future_seconds=300
min_image_bytes=1024
max_image_bytes=26214400

# Auf dem Kamera-Pi ist / normalerweise read-only. Der Worker oeffnet nur
# waehrend Capture/Spool/Upload ein gemeinsames kurzes Schreibfenster.
manage_root_mount=true
spool_root=/var/lib/camera-rpi/spool
runtime_root=/run/camera-rpi

# Fuer eine eigene HTTPS-CA kann optional eine PEM-Datei angegeben werden:
# ca_cert=/etc/camera-rpi/ca/interne-ca.pem
