# Flüchtige Verzeichnisse werden bei jedem Boot neu erzeugt. PHP-Sitzungen
# landen damit nicht auf dem read-only Root-Dateisystem.
d /run/camera-rpi 0700 root root -
d /run/camera-rpi-admin 0710 root www-data -
d /run/camera-rpi-admin/sessions 0700 www-data www-data -
d /run/camera-rpi-status 0750 root www-data -
# Shared daemon lock lets boot restore finish before the climate recorder starts.
d /run/camera-rpi-climate 0700 root root -
