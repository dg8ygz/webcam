<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Seite nicht gefunden</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5f6f8; color: #252b34; }
    main { padding: 3rem 1.5rem; max-width: 34rem; text-align: center; }
    .code { margin: 0; font-size: clamp(5rem, 20vw, 8rem); font-weight: 700; color: #76808e; }
    h1 { font-size: 1.6rem; margin: 1rem 0; }
    p { line-height: 1.6; }
    @media (prefers-color-scheme: dark) { body { background: #191d24; color: #e0e4eb; } .code { color: #929dad; } }
  </style>
</head>
<body>
  <main>
    <p class="code" aria-hidden="true">404</p>
    <h1>Seite nicht gefunden</h1>
    <p>Die angeforderte Seite konnte nicht gefunden werden.<br>Bitte prüfen Sie die eingegebene Adresse.</p>
  </main>
</body>
</html>
