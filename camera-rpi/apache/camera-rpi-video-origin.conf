# More-specific child path through the existing HTTPS maintenance edge route.
# Independent relay/credentials; no change to SSH maintenance or upload rules.
<Location "/camera-maintenance/video/">
    Require expr "%{CONN_REMOTE_ADDR} == '192.0.2.2'"
    ProxyPass "http://127.0.0.1:9087/" upgrade=websocket connectiontimeout=5 timeout=1900
    ProxyPassReverse "http://127.0.0.1:9087/"
</Location>
