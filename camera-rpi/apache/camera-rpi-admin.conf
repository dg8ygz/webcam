# Die Admin-Seite wird nicht direkt aus dem Entwicklungsverzeichnis bedient.
# Apache sieht nur public/; PHP-Programmcode und Dokumentation bleiben draussen.
Alias /camera-admin /usr/local/share/camera-rpi-admin/public

<Directory /usr/local/share/camera-rpi-admin/public>
    Options -Indexes -ExecCGI
    AllowOverride None
    DirectoryIndex index.php

    AuthType Basic
    AuthName "Camera-RPi Verwaltung"
    AuthBasicProvider file
    AuthUserFile /etc/camera-rpi/admin.htpasswd

    # Infoseite und Verwaltung sind direkt erreichbar. Nur die Verwaltung
    # verlangt Anmeldung. Bei untrusted Netzen HTTPS vor diesen Host schalten.
    Require valid-user
</Directory>

# Oeffentliche, nur lesende Infoseite. Keine Admin-Aktionen oder Keys.
# Only the exact root URL serves the overview; other legacy URLs and the
# authenticated admin alias remain untouched. Keep the old status URL working.
AliasMatch ^/$ /usr/local/share/camera-rpi-status/public/index.php
Alias /camera-status /usr/local/share/camera-rpi-status/public

<Directory /usr/local/share/camera-rpi-status/public>
    Options -Indexes -ExecCGI
    AllowOverride None
    DirectoryIndex index.php
    Require all granted
</Directory>
