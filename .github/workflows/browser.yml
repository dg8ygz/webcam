name: Isolated browser acceptance

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: webcam
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: webcam/package-lock.json
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, gd, curl, mbstring, exif
          coverage: none
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:isolated
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-browser-results
          path: webcam/e2e-artifacts/
          retention-days: 7
